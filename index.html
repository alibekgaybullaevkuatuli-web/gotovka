<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что приготовить</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E5240">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECE7D9;
    --paper: #FFFFFF;
    --ink: #23291F;
    --ink-soft: #5B6154;
    --wood: #3E5240;
    --wood-dark: #2A3A2C;
    --mustard: #C98A1D;
    --mustard-soft: #F0DAA9;
    --tomato: #B23A2E;
    --tomato-soft: #F3D8D2;
    --line: #D9D2BE;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.brand{
    font-family:'Space Grotesk', sans-serif;
  }
  header.top{
    background:var(--wood);
    color:#F3EFE2;
    padding:18px 20px;
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }
  header.top .brand{ font-size:20px; font-weight:700; letter-spacing:0.2px; }
  header.top .sub{ color:#C9CFC2; font-size:13px; }
  .mobile-tabs{ display:none; gap:8px; padding:12px 16px 0; }
  .mobile-tabs button{
    flex:1; padding:11px 8px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .mobile-tabs button.active{ background:var(--wood); color:#fff; border-color:var(--wood); }
  .layout{
    display:grid; grid-template-columns:300px 1fr; gap:22px;
    padding:22px; max-width:1180px; margin:0 auto;
  }
  @media (max-width:820px){
    header.top{padding:16px 16px 12px;}
    .mobile-tabs{display:flex;}
    .layout{display:block; padding:14px;}
    .pantry{display:none; position:static; margin-bottom:0;}
    .main{display:none;}
    .layout.show-pantry .pantry{display:block;}
    .layout.show-recipes .main{display:block;}
  }
  .pantry{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; height:fit-content; position:sticky; top:16px;
  }
  .pantry h2{ font-size:16px; margin:0 0 4px; }
  .pantry .hint{ font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; }
  .cat-title{ font-size:11.5px; color:var(--ink-soft); margin:14px 0 6px; font-weight:600; }
  .acc-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 2px; cursor:pointer; user-select:none;
    font-size:13px; font-weight:600; color:var(--ink);
  }
  .acc-header:first-of-type{ margin-top:0; }
  .acc-count{
    display:inline-block; background:var(--mustard); color:#fff; font-size:10.5px;
    border-radius:999px; padding:1px 7px; margin-left:4px; font-weight:600;
  }
  .acc-arrow{ color:var(--ink-soft); font-size:11px; }
  .acc-body{ padding-bottom:6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    border:1px solid var(--line); background:#F7F4EA; padding:8px 12px; border-radius:999px;
    font-size:13px; cursor:pointer; user-select:none; transition:all .12s ease;
  }
  .chip.on{ background:var(--wood); border-color:var(--wood); color:#fff; }
  .base-toggle{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    font-size:12.5px; display:flex; align-items:flex-start; gap:8px;
  }
  .base-toggle input{margin-top:3px;}
  .tolerance-row{ margin-top:12px; font-size:12.5px; color:var(--ink-soft); }
  .tolerance-row input{width:100%;}
  .clear-row{margin-top:12px;}
  .clear-row button{
    width:100%; padding:9px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:12.5px; cursor:pointer; color:var(--ink-soft);
  }
  .main h1{ font-size:22px; margin:0 0 4px; }
  .main .lead{ color:var(--ink-soft); font-size:13.5px; margin-bottom:14px; }

  .filter-group{ margin-bottom:12px; }
  .filter-group .fg-label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-bottom:6px; }
  .scroll-row{
    display:flex; gap:7px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:thin;
  }
  .scroll-row::-webkit-scrollbar{ height:4px; }
  .wrap-row{ display:flex; gap:7px; flex-wrap:wrap; }
  .pill-btn{
    border:1px solid var(--line); background:var(--paper); padding:7px 13px; border-radius:999px;
    font-size:12.5px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .pill-btn.active{ background:var(--mustard); border-color:var(--mustard); color:#fff; }
  .pill-btn.diet-active{ background:var(--wood); border-color:var(--wood); color:#fff; }
  .mode-toggle{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .mode-btn{
    border:none; background:var(--paper); padding:4px 9px; font-size:10.5px; cursor:pointer; color:var(--ink-soft);
  }
  .mode-btn.active{ background:var(--mustard); color:#fff; }
  .time-pill{
    display:inline-block; font-size:10px; color:var(--ink-soft); background:#F1EEE0;
    border-radius:5px; padding:2px 6px;
  }
  .prep-pill{
    display:inline-block; font-size:10px; color:#8A5A00; background:#F5E3B8;
    border-radius:5px; padding:2px 6px; font-weight:600;
  }
  .step.prep-step{ background:#FBF3DE; border-radius:8px; padding-left:6px; }
  .shopping-btn{
    display:block; width:100%; padding:11px; margin-bottom:18px;
    border:1px solid var(--wood); border-radius:8px; background:#fff;
    color:var(--wood); font-weight:600; font-size:13px; cursor:pointer;
  }
  .shopping-btn:active{ background:#F1EEE0; }
  .tool-missing-note{ font-size:11px; color:var(--tomato); margin-top:2px; }
  .surprise-block{
    background:linear-gradient(135deg, var(--wood) 0%, var(--wood-dark) 100%);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    text-align:center;
  }
  .surprise-tagline{
    color:#E7E2CF;
    font-size:12.5px;
    margin-bottom:10px;
  }
  .surprise-btn{
    display:inline-block;
    padding:12px 28px;
    border:none;
    border-radius:999px;
    background:var(--mustard);
    color:#fff;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .surprise-btn:active{ transform:scale(0.97); }
  .result-summary{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .result-summary b{ color:var(--ink); }
  .fav-btn{
    position:absolute;
    top:8px; right:8px;
    width:30px; height:30px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.85);
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .fav-btn.on{ background:#fff; }
  .modal-fav-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:6px 14px;
    font-size:12.5px;
    cursor:pointer;
    margin-left:8px;
  }
  .modal-fav-btn.on{ background:var(--tomato-soft); border-color:var(--tomato); color:var(--tomato); }

  .filter-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-btn{
    border:1px solid var(--line); background:var(--paper); padding:7px 12px; border-radius:999px;
    font-size:12.5px; cursor:pointer;
  }
  .filter-btn.active{ background:var(--mustard); border-color:var(--mustard); color:#fff; }

  .cuisine-heading{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px; font-weight:600; margin:22px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .cuisine-heading:first-child{ margin-top:0; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  @media (max-width:520px){ .grid{grid-template-columns:repeat(2,1fr); gap:10px;} }
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
  }
  .card.full-ready{
    border-color:#4F7A55;
    box-shadow:0 0 0 2px rgba(79,122,85,0.25);
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(42,58,44,0.12); }
  .card .photo{
    height:120px; background:var(--mustard-soft); display:flex; align-items:center;
    justify-content:center; font-size:40px; position:relative; overflow:hidden;
  }
  .card .photo img{ width:100%; height:100%; object-fit:cover; }
  .card .body{ padding:10px 12px 12px; }
  .card h3{ font-size:13.5px; margin:0 0 6px; line-height:1.25; }
  .match-bar{ height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:6px; }
  .match-bar > div{ height:100%; background:var(--wood); }
  .match-bar.full > div{background:#4F7A55;}
  .match-text{ font-size:11.5px; color:var(--ink-soft); }
  .match-text.full{color:#3E6B44; font-weight:600;}
  .missing{ font-size:11px; color:var(--tomato); margin-top:4px; }
  .pill-row{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  .cat-pill{
    display:inline-block; font-size:10px; color:var(--ink-soft); background:#F1EEE0;
    border-radius:5px; padding:2px 6px;
  }
  .overlay{
    position:fixed; inset:0; background:rgba(35,41,31,0.5); display:none;
    align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{ background:var(--paper); border-radius:12px; max-width:640px; width:100%; overflow:hidden; }
  @media (max-width:600px){
    .overlay{padding:0;}
    .modal{max-width:100%; min-height:100vh; border-radius:0;}
  }
  .modal .photo{
    height:200px; background:var(--mustard-soft); display:flex; align-items:center;
    justify-content:center; font-size:64px;
  }
  .modal .photo img{width:100%;height:100%;object-fit:cover;}
  .modal-body{padding:20px 20px 30px;}
  .modal-body h2{font-size:20px;margin:0 0 4px;}
  .close-btn{
    position:absolute; margin:10px; background:rgba(255,255,255,0.9); border:none;
    border-radius:50%; width:34px;height:34px; font-size:16px; cursor:pointer;
  }
  .servings-row{
    display:flex; align-items:center; gap:10px; margin:14px 0 16px; padding:10px 12px;
    background:#F7F4EA; border-radius:8px; flex-wrap:wrap;
  }
  .servings-row button{
    width:32px;height:32px; border-radius:50%; border:1px solid var(--line);
    background:#fff; font-size:16px; cursor:pointer;
  }
  .servings-row .count{font-weight:600; min-width:70px; text-align:center;}
  .servings-row .tol{font-size:11.5px; color:var(--ink-soft); margin-left:auto;}
  table.ing{ width:100%; border-collapse:collapse; margin-bottom:20px; font-size:13px; }
  table.ing td{ padding:6px 4px; border-bottom:1px solid var(--line); }
  table.ing td.have{color:#3E6B44;}
  table.ing td.miss{color:var(--tomato);}
  table.ing td.amt{text-align:right; white-space:nowrap; color:var(--ink-soft);}
  .steps h3{font-size:14.5px; margin-bottom:8px;}
  .step{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .step:last-child{border-bottom:none;}
  .step-num{
    width:22px;height:22px; border-radius:50%; background:var(--wood); color:#fff;
    font-size:11.5px; display:flex;align-items:center;justify-content:center; flex-shrink:0; margin-top:2px;
  }
  .step-text{flex:1; font-size:13px;}
  .timer{ display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12.5px; flex-wrap:wrap; }
  .timer .tbtn{ border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 16px; cursor:pointer; font-size:13.5px; font-weight:600; min-height:38px; }
  .timer .tbtn.stop{border-color:var(--tomato); color:var(--tomato);}
  .timer .clock{ font-family:'Space Grotesk', sans-serif; font-weight:600; min-width:52px; }
  .timer.done .clock{color:var(--tomato);}
  .step.flash{background:var(--tomato-soft);}
  .empty{ color:var(--ink-soft); font-size:13.5px; padding:30px 10px; text-align:center; }
  .sub-note{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:1px;
    font-weight:400;
  }
  .tools-block{ margin-bottom:16px; }
  .tool-pill{
    border:1px solid var(--line);
    background:#F7F4EA;
    padding:5px 11px;
    border-radius:999px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .tool-pill.have-tool{
    background:#E3EFE3;
    border-color:#B9D6BA;
    color:#3E6B44;
  }
  .tool-pill.miss-tool{
    background:var(--tomato-soft);
    border-color:#E3B3AB;
    color:var(--tomato);
  }
  .chip.tool-chip{ font-size:12.5px; }
  .search-box{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:13.5px; margin-bottom:12px; font-family:inherit;
  }
  .pantry-search{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:13px; margin:2px 0 12px; font-family:inherit;
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">🍲 Что приготовить</div>
  <div class="sub">выбери, что есть дома — остальное посчитаю сам</div>
</header>

<div class="mobile-tabs">
  <button id="tabPantry" class="active">Кладовая</button>
  <button id="tabRecipes">Рецепты</button>
</div>

<div class="layout show-pantry" id="layout">

  <aside class="pantry" id="pantry"></aside>

  <main class="main">
    <h1>Что приготовим?</h1>
    <div class="lead">Отмечай продукты слева — покажу, что можно приготовить.</div>

    <input class="search-box" id="search" placeholder="Поиск блюда по названию...">

    <div class="surprise-block">
      <div class="surprise-tagline">Не знаешь, что приготовить? Я выберу за тебя.</div>
      <button class="surprise-btn" id="surpriseBtn">🎲 Удиви меня</button>
    </div>

    <div class="result-summary" id="resultSummary"></div>

    <div class="filter-row">
      <button class="filter-btn active" data-f="all">Все рецепты</button>
      <button class="filter-btn" data-f="full">Можно приготовить сейчас</button>
      <button class="filter-btn" data-f="favorites">❤️ Избранное</button>
    </div>

    <div class="filter-group">
      <div class="fg-label">Приём пищи</div>
      <div class="scroll-row" id="mealRow"></div>
    </div>

    <div class="filter-group">
      <div class="fg-label">Кухня</div>
      <div class="scroll-row" id="cuisineRow"></div>
    </div>

    <div class="filter-group">
      <div class="fg-label" style="display:flex; align-items:center; justify-content:space-between;">
        <span>Особенности</span>
        <span class="mode-toggle" id="dietModeToggle">
          <button class="mode-btn" data-m="all">Все выбранные</button>
          <button class="mode-btn" data-m="any">Любое из них</button>
        </span>
      </div>
      <div class="wrap-row" id="dietRow"></div>
    </div>

    <div id="gridWrap"></div>
  </main>

</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>

/* ---------- состояние ---------- */

const state = {
  have: new Set(),
  baseAlways: true,
  haveTools: new Set(),
  baseToolsAlways: true,
  tolerance: 8,
  filter: "all",
  search: "",
  cuisine: "all",
  diets: new Set(),
  dietMode: "all",
  favorites: new Set(),
  meal: "all"
};

/* ---------- сохранение состояния ---------- */

const STORAGE_KEY = "gotovka_state_v1";

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      have: [...state.have],
      haveTools: [...state.haveTools],
      baseAlways: state.baseAlways,
      baseToolsAlways: state.baseToolsAlways,
      tolerance: state.tolerance,
      filter: state.filter,
      search: state.search,
      cuisine: state.cuisine,
      diets: [...state.diets],
      dietMode: state.dietMode,
      favorites: [...state.favorites],
      meal: state.meal
    }));
  }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(Array.isArray(data.have)) state.have = new Set(data.have);
    if(Array.isArray(data.haveTools)) state.haveTools = new Set(data.haveTools);
    if(typeof data.baseAlways === "boolean") state.baseAlways = data.baseAlways;
    if(typeof data.baseToolsAlways === "boolean") state.baseToolsAlways = data.baseToolsAlways;
    if(typeof data.tolerance === "number") state.tolerance = data.tolerance;
    if(typeof data.filter === "string") state.filter = data.filter;
    if(typeof data.search === "string") state.search = data.search;
    if(typeof data.cuisine === "string") state.cuisine = data.cuisine;
    if(Array.isArray(data.diets)) state.diets = new Set(data.diets);
    if(typeof data.dietMode === "string") state.dietMode = data.dietMode;
    if(Array.isArray(data.favorites)) state.favorites = new Set(data.favorites);
    if(typeof data.meal === "string") state.meal = data.meal;
  }catch(e){}
}

loadState();

/* ---------- рендер кладовой ---------- */

const pantryEl = document.getElementById("pantry");

function renderPantry(){
  const q = pantrySearchQuery.trim().toLowerCase();
  let html = `<h2>Что есть дома</h2><div class="hint">Нажимай на продукты — они появятся в расчёте рецептов.</div>`;
  html += `<input class="pantry-search" id="pantrySearchInput" placeholder="Найти продукт или инструмент..." value="${pantrySearchQuery.replace(/"/g,'&quot;')}">`;

  let anyMatch = false;

  PANTRY_CATEGORIES.forEach(cat=>{
    const items = q ? cat.items.filter(i=> i.toLowerCase().includes(q)) : cat.items;
    if(q && items.length===0) return;
    if(items.length) anyMatch = true;
    const isOpen = q ? true : pantryOpenCats.has(cat.name);
    const count = cat.items.filter(i=>state.have.has(i)).length;
    html += `
    <div class="acc-header" data-cat="${cat.name}">
      <span>${cat.name}${count?` <span class="acc-count">${count}</span>`:""}</span>
      <span class="acc-arrow">${isOpen?"▾":"▸"}</span>
    </div>
    <div class="acc-body" style="${isOpen?"":"display:none;"}">
      <div class="chips">`;
    items.forEach(item=>{
      const on = state.have.has(item) ? "on" : "";
      html += `<div class="chip" data-item="${item}" style="${on?'background:var(--wood);border-color:var(--wood);color:#fff;':''}">${item}</div>`;
    });
    html += `</div></div>`;
  });

  html += `
    <div class="base-toggle">
      <input type="checkbox" id="baseAlways" ${state.baseAlways?"checked":""}>
      <label for="baseAlways">У меня всегда есть соль, масло, специи — не учитывать их как «нехватку»</label>
    </div>
    <div class="tolerance-row">
      Погрешность расчёта пропорций: <b id="tolVal">${state.tolerance}%</b>
      <input type="range" id="tolRange" min="0" max="20" value="${state.tolerance}">
    </div>
  `;

  const toolsItems = q ? TOOLS_LIST.filter(t=> t.toLowerCase().includes(q)) : TOOLS_LIST;
  if(!q || toolsItems.length){
    if(toolsItems.length) anyMatch = true;
    const toolsOpen = q ? true : pantryOpenCats.has("__tools__");
    const toolsCount = TOOLS_LIST.filter(t=>state.haveTools.has(t)).length;
    html += `
    <div class="acc-header" data-cat="__tools__" style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line);">
      <span>🛠 Кухонная техника${toolsCount?` <span class="acc-count">${toolsCount}</span>`:""}</span>
      <span class="acc-arrow">${toolsOpen?"▾":"▸"}</span>
    </div>
    <div class="acc-body" style="${toolsOpen?"":"display:none;"}">
      <div class="chips">`;
    toolsItems.forEach(tool=>{
      const on = state.haveTools.has(tool) ? "on" : "";
      html += `<div class="chip tool-chip" data-tool="${tool}" style="${on?'background:var(--wood);border-color:var(--wood);color:#fff;':''}">${tool}</div>`;
    });
    html += `</div>
    <div class="base-toggle">
      <input type="checkbox" id="baseToolsAlways" ${state.baseToolsAlways?"checked":""}>
      <label for="baseToolsAlways">У меня всегда есть нож, кастрюля, сковорода, венчик</label>
    </div>
  </div>`;
  }

  if(q && !anyMatch){
    html += `<div class="empty" style="padding:14px 4px;">Ничего не найдено по запросу «${pantrySearchQuery}»</div>`;
  }

  html += `
    <div class="clear-row">
      <button id="clearBtn">Очистить кладовую</button>
    </div>
  `;
  pantryEl.innerHTML = html;

  const searchInput = document.getElementById("pantrySearchInput");
  if(searchInput){
    searchInput.addEventListener("input", e=>{
      pantrySearchQuery = e.target.value;
      renderPantry();
      const el = document.getElementById("pantrySearchInput");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }

  pantryEl.querySelectorAll(".acc-header").forEach(h=>{
    h.addEventListener("click", ()=>{
      const cat = h.dataset.cat;
      if(pantryOpenCats.has(cat)) pantryOpenCats.delete(cat); else pantryOpenCats.add(cat);
      renderPantry();
    });
  });
  pantryEl.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const item = chip.dataset.item;
      if(state.have.has(item)) state.have.delete(item); else state.have.add(item);
      saveState();
      renderPantry();
      renderGrid();
    });
  });
  document.getElementById("baseAlways").addEventListener("change", e=>{
    state.baseAlways = e.target.checked;
    saveState();
    renderGrid();
  });
  pantryEl.querySelectorAll(".tool-chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const tool = chip.dataset.tool;
      if(state.haveTools.has(tool)) state.haveTools.delete(tool); else state.haveTools.add(tool);
      saveState();
      renderPantry();
      renderGrid();
    });
  });
  document.getElementById("baseToolsAlways").addEventListener("change", e=>{
    state.baseToolsAlways = e.target.checked;
    saveState();
    renderGrid();
  });
  document.getElementById("tolRange").addEventListener("input", e=>{
    state.tolerance = parseInt(e.target.value);
    document.getElementById("tolVal").textContent = state.tolerance + "%";
    saveState();
    renderGrid();
  });
  document.getElementById("clearBtn").addEventListener("click", ()=>{
    state.have.clear();
    state.haveTools.clear();
    saveState();
    renderPantry();
    renderGrid();
  });
}

function renderDietModeToggle(){
  document.querySelectorAll(".mode-btn").forEach(btn=>{

      state.dietMode = btn.dataset.m;
      saveState();
      renderDietModeToggle();
      renderGrid();
    };
  });

/* ---------- логика совпадений ---------- */

function isHave(name){
  if(state.have.has(name)) return true;
  if(state.baseAlways && BASE_ALWAYS.includes(name)) return true;
  return false;
}

function isHaveTool(name){
  if(state.haveTools.has(name)) return true;
  if(state.baseToolsAlways && BASE_TOOLS_ALWAYS.includes(name)) return true;
  return false;
}

function matchInfo(recipe){
  const total = recipe.ingredients.length;
  let have = 0;
  const missing = [];
  recipe.ingredients.forEach(ing=>{
    if(isHave(ing.n)) have++; else missing.push(ing.n);
  });
  return {have, total, pct: Math.round((have/total)*100), missing};
}

function toolInfo(recipe){
  const tools = recipe.tools || [];
  const missing = tools.filter(t=> !isHaveTool(t));
  return {total: tools.length, have: tools.length - missing.length, missing};
}

function needsAdvancePrep(recipe){
  return recipe.steps.some(s=> /заранее|на ночь/i.test(s.t));
}

function recipeDurationSec(recipe){
  return recipe.steps.reduce((s,st)=> s + (st.sec||0), 0);
}

function fmtDuration(totalSec){
  const mins = Math.round(totalSec/60);
  if(mins < 60) return `~${mins} мин`;
  const h = Math.floor(mins/60);
  const m = mins%60;
  return m ? `~${h} ч ${m} мин` : `~${h} ч`;
}

/* ---------- рендер сетки рецептов ---------- */

const gridWrap = document.getElementById("gridWrap");

function applyCommonFilters(list){
  if(state.meal !== "all"){
    const mealMeta = MEALS.find(m=>m.id===state.meal);
    if(mealMeta) list = list.filter(x=> mealMeta.cats.includes(x.r.cat));
  }
  if(state.filter === "full"){
    list = list.filter(x=> x.m.missing.length===0 && x.tm.missing.length===0);
  }
  if(state.filter === "favorites"){
    list = list.filter(x=> state.favorites.has(x.r.id));
  }
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(x=> x.r.name.toLowerCase().includes(q));
  }
  if(state.diets.size > 0){
    if(state.dietMode === "any"){
      list = list.filter(x=> [...state.diets].some(d => x.r.diet.includes(d)));
    } else {
      list = list.filter(x=> [...state.diets].every(d => x.r.diet.includes(d)));
    }
  }
  return list;
}

function cardHtml(r, m, tm){
  const ingredientsReady = m.missing.length===0;
  const fullyReady = ingredientsReady && tm.missing.length===0;
  const cuisineMeta = CUISINES.find(c=>c.id===r.cuisine);
  const duration = fmtDuration(recipeDurationSec(r));
  const prepNeeded = needsAdvancePrep(r);
  let statusText;
  if(fullyReady){
    statusText = "Можно приготовить сейчас";
  } else if(ingredientsReady){
    statusText = "Продукты есть, не хватает техники";
  } else {
    statusText = m.have + "/" + m.total + " продуктов есть";
  }
  const MAX_MISSING_SHOWN = 3;
  let missingText = "";
  if(!ingredientsReady){
    const shown = m.missing.slice(0, MAX_MISSING_SHOWN).join(", ");
    const rest = m.missing.length - MAX_MISSING_SHOWN;
    missingText = `Не хватает: ${shown}${rest > 0 ? ` +ещё ${rest}` : ""}`;
  }
  return `
    <div class="card ${fullyReady?'full-ready':''}" data-id="${r.id}">
      <div class="photo">
        <img src="https://loremflickr.com/380/260/${r.tag}" loading="lazy"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span style="display:none; font-size:40px;">${r.emoji}</span>
        <button class="fav-btn ${state.favorites.has(r.id)?'on':''}" data-fav="${r.id}">${state.favorites.has(r.id)?'❤️':'🤍'}</button>
      </div>
      <div class="body">
        <div class="pill-row">
          <span class="cat-pill">${cuisineMeta ? cuisineMeta.emoji : ""} ${r.cat}</span>
          <span class="time-pill">⏱ ${duration}</span>
          ${prepNeeded ? `<span class="prep-pill">⏰ заранее</span>` : ""}
        </div>
        <h3>${r.name}</h3>
        <div class="match-bar ${fullyReady?'full':''}"><div style="width:${m.pct}%;"></div></div>
        <div class="match-text ${fullyReady?'full':''}">${statusText}</div>
        ${ingredientsReady ? "" : `<div class="missing">${missingText}</div>`}
        ${(ingredientsReady && !fullyReady) ? `<div class="tool-missing-note">🛠 нет: ${tm.missing.join(", ")}</div>` : ""}
      </div>
    </div>`;
}

function computeSummary(){
  let list = RECIPES.map(r=>({r, m:matchInfo(r), tm:toolInfo(r)}));
  if(state.cuisine !== "all"){
    list = list.filter(x=> x.r.cuisine === state.cuisine);
  }
  if(state.meal !== "all"){
    const mealMeta = MEALS.find(m=>m.id===state.meal);
    if(mealMeta) list = list.filter(x=> mealMeta.cats.includes(x.r.cat));
  }
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(x=> x.r.name.toLowerCase().includes(q));
  }
  if(state.diets.size > 0){
    if(state.dietMode === "any"){
      list = list.filter(x=> [...state.diets].some(d => x.r.diet.includes(d)));
    } else {
      list = list.filter(x=> [...state.diets].every(d => x.r.diet.includes(d)));
    }
  }
  const total = list.length;
  const ready = list.filter(x=> x.m.missing.length===0 && x.tm.missing.length===0).length;
  return {total, ready};
}

function renderGrid(){
  const summary = computeSummary();
  const summaryEl = document.getElementById("resultSummary");
  if(summaryEl){
    summaryEl.innerHTML = summary.total === 0
      ? "Ничего не подходит под текущие фильтры"
      : `Найдено <b>${summary.total}</b> ${summary.total===1?"рецепт":"рецептов"} · 🟢 можно приготовить сейчас: <b>${summary.ready}</b>`;
  }

  let list = RECIPES.map(r=>({r, m:matchInfo(r), tm:toolInfo(r)}));

  if(state.cuisine !== "all"){
    list = list.filter(x=> x.r.cuisine === state.cuisine);
    list = applyCommonFilters(list);
    list.sort((a,b)=> b.m.pct - a.m.pct);
    if(list.length===0){
      gridWrap.innerHTML = `<div class="empty">Ничего не найдено — попробуй снять фильтры или отметить больше продуктов.</div>`;
      return;
    }
    gridWrap.innerHTML = `<div class="grid">${list.map(x=>cardHtml(x.r,x.m,x.tm)).join("")}</div>`;
  } else {
    list = applyCommonFilters(list);
    if(list.length===0){
      gridWrap.innerHTML = `<div class="empty">Ничего не найдено — попробуй снять фильтры или отметить больше продуктов.</div>`;
      return;
    }
    let html = "";
    CUISINES.forEach(c=>{
      const group = list.filter(x=> x.r.cuisine === c.id);
      if(group.length===0) return;
      group.sort((a,b)=> b.m.pct - a.m.pct);
      html += `<div class="cuisine-heading">${c.emoji} ${c.name}</div>`;
      html += `<div class="grid">${group.map(x=>cardHtml(x.r,x.m,x.tm)).join("")}</div>`;
    });
    gridWrap.innerHTML = html || `<div class="empty">Ничего не найдено.</div>`;
  }

  gridWrap.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click", ()=> openRecipe(card.dataset.id));
  });
  gridWrap.querySelectorAll(".fav-btn").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      toggleFavorite(btn.dataset.fav);
    });
  });
}

function toggleFavorite(id){
  if(state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
  saveState();
  renderGrid();
  if(overlay.classList.contains("show")){
    const recipe = RECIPES.find(r=>r.id===id);
    if(recipe) renderModal(recipe);
  }
}

function surpriseMe(){
  let list = RECIPES.map(r=>({r, m:matchInfo(r), tm:toolInfo(r)}));

  if(state.cuisine !== "all"){
    list = list.filter(x=> x.r.cuisine === state.cuisine);
  }
  if(state.meal !== "all"){
    const mealMeta = MEALS.find(m=>m.id===state.meal);
    if(mealMeta) list = list.filter(x=> mealMeta.cats.includes(x.r.cat));
  }
  if(state.diets.size > 0){
    if(state.dietMode === "any"){
      list = list.filter(x=> [...state.diets].some(d => x.r.diet.includes(d)));
    } else {
      list = list.filter(x=> [...state.diets].every(d => x.r.diet.includes(d)));
    }
  }
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(x=> x.r.name.toLowerCase().includes(q));
  }

  if(list.length === 0){
    alert("По текущим фильтрам ничего не нашлось — попробуй снять часть фильтров.");
    return;
  }

  const ready = list.filter(x=> x.m.missing.length===0 && x.tm.missing.length===0);
  const pool = ready.length ? ready : list;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  openRecipe(pick.r.id);
}

document.getElementById("surpriseBtn").addEventListener("click", surpriseMe);

document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.filter = btn.dataset.f;
    saveState();
    renderGrid();
  });
});

document.getElementById("search").addEventListener("input", e=>{
  state.search = e.target.value;
  saveState();
  renderGrid();
});

/* ---------- мобильные вкладки ---------- */

const layoutEl = document.getElementById("layout");
const tabPantry = document.getElementById("tabPantry");
const tabRecipes = document.getElementById("tabRecipes");

tabPantry.addEventListener("click", ()=>{
  layoutEl.classList.add("show-pantry");
  layoutEl.classList.remove("show-recipes");
  tabPantry.classList.add("active");
  tabRecipes.classList.remove("active");
});
tabRecipes.addEventListener("click", ()=>{
  layoutEl.classList.add("show-recipes");
  layoutEl.classList.remove("show-pantry");
  tabRecipes.classList.add("active");
  tabPantry.classList.remove("active");
});

/* ---------- модалка рецепта ---------- */

const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
let currentServings = {};
const timers = {};

function scaledAmount(base, factor){
  const val = base * factor;
  const low = val * (1 - state.tolerance/100);
  const high = val * (1 + state.tolerance/100);
  const round = v => v >= 10 ? Math.round(v) : Math.round(v*10)/10;
  if(state.tolerance === 0) return `${round(val)}`;
  return `${round(low)}–${round(high)}`;
}

function openRecipe(id){
  const recipe = RECIPES.find(r=>r.id===id);
  if(!currentServings[id]) currentServings[id] = recipe.baseServings;
  renderModal(recipe);
  overlay.classList.add("show");
}

function closeRecipe(){
  overlay.classList.remove("show");
  Object.keys(timers).forEach(k=>{
    if(timers[k] && timers[k].interval) clearInterval(timers[k].interval);
  });
}

function renderModal(recipe){
  const servings = currentServings[recipe.id];
  const factor = servings / recipe.baseServings;
  const m = matchInfo(recipe);
  const cuisineMeta = CUISINES.find(c=>c.id===recipe.cuisine);
  const dietNames = recipe.diet.map(d => (DIETS.find(x=>x.id===d)||{}).name).filter(Boolean);

  const ingRows = recipe.ingredients.map(ing=>{
    const have = isHave(ing.n);
    const sub = SUBSTITUTIONS[ing.n];
    const subHtml = sub ? `<div class="sub-note">замена: ${sub.join(", ")}</div>` : "";
    return `<tr>
      <td class="${have?'have':'miss'}">${have?'✓':'✕'} ${ing.n}${subHtml}</td>
      <td class="amt">${scaledAmount(ing.a, factor)} ${ing.u}</td>
    </tr>`;
  }).join("");

  const stepsHtml = recipe.steps.map((s,i)=>{
    const key = recipe.id+"-"+i;
    const hasTimer = !!s.sec;
    const isPrep = /заранее|на ночь/i.test(s.t);
    return `
    <div class="step ${isPrep?'prep-step':''}" id="step-${key}">
      <div class="step-num">${isPrep?'⏰':i+1}</div>
      <div class="step-text">
        ${s.t}
        ${hasTimer ? `
        <div class="timer" id="timer-${key}">
          <span class="clock" id="clock-${key}">${fmtTime(s.sec)}</span>
          <button class="tbtn" onclick="startTimer('${recipe.id}',${i},${s.sec})">Старт</button>
          <button class="tbtn stop" onclick="resetTimer('${recipe.id}',${i},${s.sec})">Сброс</button>
        </div>` : ""}
      </div>
    </div>`;
  }).join("");

  modal.innerHTML = `
    <div style="position:relative;">
      <button class="close-btn" onclick="closeRecipe()">✕</button>
      <div class="photo">
        <img src="https://loremflickr.com/640/440/${recipe.tag}"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span style="display:none; font-size:64px;">${recipe.emoji}</span>
      </div>
    </div>
    <div class="modal-body">
      <div class="pill-row">
        <span class="cat-pill">${cuisineMeta ? cuisineMeta.emoji : ""} ${cuisineMeta ? cuisineMeta.name : ""}</span>
        <span class="cat-pill">${recipe.cat}</span>
        ${dietNames.map(d=>`<span class="cat-pill">${d}</span>`).join("")}
      </div>
      <h2 style="display:flex; align-items:center; flex-wrap:wrap;">
        ${recipe.name}
        <button class="modal-fav-btn ${state.favorites.has(recipe.id)?'on':''}" onclick="toggleFavorite('${recipe.id}')">
          ${state.favorites.has(recipe.id) ? "❤️ В избранном" : "🤍 В избранное"}
        </button>
      </h2>
      <div style="color:var(--ink-soft); font-size:12.5px;">${m.have}/${m.total} продуктов уже есть дома</div>

      <div class="servings-row">
        <button onclick="changeServings('${recipe.id}',-1)">−</button>
        <div class="count">${servings} порц.</div>
        <button onclick="changeServings('${recipe.id}',1)">+</button>
        <div class="tol">± ${state.tolerance}% на глаз</div>
      </div>

      ${recipe.tools && recipe.tools.length ? `
      <div class="tools-block">
        <div class="fg-label">Нужна техника / посуда</div>
        <div class="wrap-row">${recipe.tools.map(t=>{
          const has = isHaveTool(t);
          if(has) return `<span class="tool-pill have-tool">✓ ${t}</span>`;
          const subs = TOOL_SUBSTITUTIONS[t];
          const subText = subs ? ` — замена: ${subs.join(", ")}` : "";
          return `<span class="tool-pill miss-tool">✕ ${t}${subText}</span>`;
        }).join("")}</div>
      </div>` : ""}

      <table class="ing">${ingRows}</table>

      ${m.missing.length ? `<button class="shopping-btn" id="shoppingBtn" data-id="${recipe.id}">📋 Скопировать список покупок (${m.missing.length})</button>` : ""}

      <div class="steps">
        <h3>Шаги</h3>
        ${stepsHtml}
      </div>
    </div>
  `;

  const shoppingBtn = document.getElementById("shoppingBtn");
  if(shoppingBtn){
    shoppingBtn.addEventListener("click", ()=>{
      const lines = recipe.ingredients
        .filter(ing=> !isHave(ing.n))
        .map(ing=> `- ${ing.n}: ${scaledAmount(ing.a, factor)} ${ing.u}`);
      const text = `Список покупок — ${recipe.name}:\n` + lines.join("\n");
      const done = ()=>{
        shoppingBtn.textContent = "✓ Скопировано";
        setTimeout(()=>{ shoppingBtn.textContent = `📋 Скопировать список покупок (${lines.length})`; }, 2000);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(()=> alert(text));
      } else {
        alert(text);
      }
    });
  }
}

function changeServings(id, delta){
  currentServings[id] = Math.max(1, currentServings[id] + delta);
  const recipe = RECIPES.find(r=>r.id===id);
  renderModal(recipe);
}

function fmtTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${m}:${s.toString().padStart(2,"0")}`;
}

function startTimer(recipeId, idx, totalSec){
  const key = recipeId+"-"+idx;
  if(timers[key] && timers[key].interval) return;
  let remaining = (timers[key] && timers[key].left != null) ? timers[key].left : totalSec;
  timers[key] = timers[key] || {};
  timers[key].interval = setInterval(()=>{
    remaining--;
    const clockEl = document.getElementById("clock-"+key);
    if(clockEl) clockEl.textContent = fmtTime(Math.max(remaining,0));
    if(remaining <= 0){
      clearInterval(timers[key].interval);
      timers[key].interval = null;
      timers[key].left = 0;
      const stepEl = document.getElementById("step-"+key);
      const timerEl = document.getElementById("timer-"+key);
      if(stepEl) stepEl.classList.add("flash");
      if(timerEl) timerEl.classList.add("done");
      beep();
    } else {
      timers[key].left = remaining;
    }
  }, 1000);
}

function resetTimer(recipeId, idx, totalSec){
  const key = recipeId+"-"+idx;
  if(timers[key] && timers[key].interval) clearInterval(timers[key].interval);
  timers[key] = {interval:null, left:totalSec};
  const clockEl = document.getElementById("clock-"+key);
  if(clockEl) clockEl.textContent = fmtTime(totalSec);
  const stepEl = document.getElementById("step-"+key);
  const timerEl = document.getElementById("timer-"+key);
  if(stepEl) stepEl.classList.remove("flash");
  if(timerEl) timerEl.classList.remove("done");
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 400);
  }catch(e){}
}

overlay.addEventListener("click", e=>{
  if(e.target === overlay) closeRecipe();
});

/* ---------- старт ---------- */

document.getElementById("search").value = state.search;
document.querySelectorAll(".filter-btn").forEach(b=>{
  b.classList.toggle("active", b.dataset.f === state.filter);
});

renderPantry();
renderMealRow();
renderCuisineRow();
renderDietRow();
renderDietModeToggle();
renderGrid();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
